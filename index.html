<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kids Adventure</title>

<link rel="stylesheet" href="kids.css">
</head>

<body onload="welcomeSound()">

<!-- Splash Screen -->
<div id="splash">
    <div class="splash-logo">🎓</div>
    <h1>Smart Kids Adventure</h1>
    <p>Learn • Play • Grow</p>
</div>

<!-- Header -->
<div class="header">
    <div class="logo">🎓</div>
    <h1>Smart Kids Adventure</h1>
    <p>Learn • Play • Grow</p>
</div>

<h2 class="title">🎮 Choose a Game</h2>

<!-- Menu -->
<div class="menu">

<button class="alphabet" onclick="showAlphabet()">
    <span class="emoji">🔤</span>
    <span class="text">Alphabet</span>
</button>

<button class="numbers" onclick="showNumbers()">
    <span class="emoji">🔢</span>
    <span class="text">Numbers</span>
</button>



<button class="colors" onclick="showColors()">
    <span class="emoji">🎨</span>
    <span class="text">Colors</span>
</button>
<button class="animals" onclick="showAnimals()">
    <span class="emoji">🐘</span>
    <span class="text">Animals</span>
</button>

<button class="fruits" onclick="showFruits()">
    <span class="emoji">🍎</span>
    <span class="text">Fruits</span>
</button>

<button class="math" onclick="showMath()">
    <span class="emoji">➕</span>
    <span class="text">Math</span>
</button>


<button class="games" onclick="showGames()">🎮 Games</button>

<button class="rhymes" onclick="showRhymes()">🎵 Rhymes</button>

<button class="greetings" onclick="showGreetings()">👋 Greetings</button>
<button class="shapes" onclick="showShapes()">🔷 Shapes</button>

<button class="vehicles" onclick="showVehicles()">🚗 Vehicles</button>

<button class="birds" onclick="showBirds()">🐦 Birds</button>

<button class="bodyparts" onclick="showBodyParts()">👨‍👩‍👧 Body Parts</button>

<button class="days" onclick="showDaysMonths()">🌍 Days & Months</button>

</div> <!-- Menu ختم -->

<!-- Content -->
<div id="content"></div>
<!-- Footer -->
<footer class="footer">
    <p class="powered">Powered by</p>
    <h2 class="name">Nadeem Hussain Channa</h2>
    <p class="teacher">Primary School Teacher</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="kids.js"></script>

<audio id="clickSound">
    <source src="click.mp3" type="audio/mpeg">
</audio>

</body>
        </html>
