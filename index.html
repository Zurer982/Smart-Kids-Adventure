<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kids Adventure</title>

<link rel="stylesheet" href="kids.css">
</head>

<body onload="welcomeSound()">

<div id="splash">
    <div class="splash-logo">🎓</div>
    <h1>Smart Kids Adventure</h1>
    <p>Learn • Play • Grow</p>
</div>

<header class="header">
    <div class="logo">🎓</div>
    <h1>Smart Kids Adventure</h1>
    <p>Learn • Play • Grow</p>
</header>

<main class="main">

<h2 class="title">🎮 Choose a Game</h2>

<div class="menu">

<button class="alphabet" onclick="showAlphabet()"><span class="emoji">🔤</span><span class="text">Alphabet</span></button>

<button class="numbers" onclick="showNumbers()"><span class="emoji">🔢</span><span class="text">Numbers</span></button>

<button class="colors" onclick="showColors()"><span class="emoji">🎨</span><span class="text">Colors</span></button>

<button class="animals" onclick="showAnimals()"><span class="emoji">🐘</span><span class="text">Animals</span></button>

<button class="fruits" onclick="showFruits()"><span class="emoji">🍎</span><span class="text">Fruits</span></button>

<button class="math" onclick="showMath()"><span class="emoji">➕</span><span class="text">Math</span></button>

<button class="games" onclick="showGames()"><span class="emoji">🎮</span><span class="text">Games</span></button>

<button class="rhymes" onclick="showRhymes()"><span class="emoji">🎵</span><span class="text">Rhymes</span></button>

<button class="greetings" onclick="showGreetings()"><span class="emoji">👋</span><span class="text">Greetings</span></button>

<button class="shapes" onclick="showShapes()"><span class="emoji">🔷</span><span class="text">Shapes</span></button>

<button class="vehicles" onclick="showVehicles()"><span class="emoji">🚗</span><span class="text">Vehicles</span></button>

<button class="birds" onclick="showBirds()"><span class="emoji">🐦</span><span class="text">Birds</span></button>

<button class="bodyparts" onclick="showBodyParts()"><span class="emoji">👨‍👩‍👧</span><span class="text">Body Parts</span></button>

<button class="days" onclick="showDaysMonths()"><span class="emoji">🌍</span><span class="text">Days & Months</span></button>

</div>

<div id="content"></div>

</main>

<footer class="footer">
    <p class="powered">Powered by</p>
    <h2 class="name">Nadeem Hussain Channa</h2>
    <p class="teacher">Primary School Teacher</p>
</footer>

<audio id="clickSound">
    <source src="click.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="kids.js"></script>

</body>
                                                                              </html>
